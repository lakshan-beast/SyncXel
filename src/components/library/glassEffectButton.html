<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Frontend Project Lab | Glass Effect Buttons</title>
    <style>
      .effect-button {
        outline: none;
        height: 60px;
        width: 160px;
        border-radius: 50px;
        border: 3px solid white;
        background: none;
        letter-spacing: 4px;
        font-weight: bolder;
        color: white;
        padding: 14px;
        font-size: 20px;
        cursor: pointer;
        transition: 0.3s cubic-bezier(0.4, 0.47, 0, 1, 93);
        margin: 5px;
        display: inline-block;
      }
      /* button hover  */
      .effect-button:hover {
        box-shadow:
          0px 0px 55px white,
          0px 0px 55px white inset;
        box-shadow: 0px 0px 55px white;
        -webkit-box-reflect: below 0px
          linear-gradient(transparent, transparent, #0004);
      }
    </style>
  </head>
  <body>
    <button type="button" class="effect-button">Button</button>
  </body>
</html>
